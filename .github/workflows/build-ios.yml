name: Build iPadOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipados:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Initialize Capacitor iPadOS
        run: |
          npx cap add ios
          npx cap copy ios

      - name: Build Xcode iPadOS App (.ipa)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release -derivedDataPath build archive -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO TARGETED_DEVICE_FAMILY="1,2"
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r PyPadStudio_iPadOS.ipa Payload

      - name: Upload iPadOS IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: PyPadStudio_iPadOS.ipa
          path: ios/App/PyPadStudio_iPadOS.ipa

name: Build iPadOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipados:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Sync Capacitor iPadOS Project
        run: |
          npx cap sync ios

      - name: Build Xcode Archive
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            TARGETED_DEVICE_FAMILY="1,2"

      - name: Package Payload to .IPA
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r PyPadStudio_iPadOS.ipa Payload

      - name: Upload iPadOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyPadStudio_iPadOS.ipa
          path: ios/App/PyPadStudio_iPadOS.ipa
